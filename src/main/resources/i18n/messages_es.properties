help.section.config.title=Configuración (config.properties)
help.config.path.note1=Si quieres modificar la configuración del programa, ciérralo primero y después ve a:
help.config.path.note2=Edita config.properties y vuelve a ejecutar la aplicación. Borra el archivo para recuperar todos los valores por defecto.
help.config.language.desc=Idioma de la interfaz: ca (catalán), en (inglés) o es (castellano). Hay que reiniciar para aplicarlo.
help.config.metallophone.desc=true = modo metalófono (registro MIDI fijo); false = usa lowestMidi / highestMidi para definir un registro personalizado.
help.config.midirange.desc=Registro de notas MIDI mostrado en el teclado (solo si isMetallophone=false). Do central = 60.

help.config.window.desc=Tamaño inicial de la ventana como fracción de la pantalla (0.0–1.0). Ejemplo: screenWidthRatio=0.8  screenHeightRatio=0.8.
help.config.camera.desc=Número de compases visibles a la vez en la vista de la partitura.
help.config.resolution.desc=Resolución rítmica: columnas por negra. Valores comunes: 12 (precisión de corchea), 24 (precisión de semicorchea).
help.config.capacity.desc=Anchura total de la partitura en columnas (capacidad máxima de la partitura).
help.config.autocorrect.desc=Autocorrección al arrastrar: evita solapamientos accidentales de notas al introducirlas (true/false).

help.back.to.index=↑ Vuelve al índice

# Comentarios de config.properties
config.close.warning=IMPORTANTE: cierra la aplicación antes de modificar este archivo. Los cambios hechos mientras la app está abierta se perderán al cerrarla.
config.language.comment=Idioma de la interfaz (ca = catalán, en = inglés, es = castellano). Reinicia la app para aplicarlo.
config.screenSize.comment=Tamaño de la ventana respecto a la pantalla: anchura y altura (0.0-1.0).
config.nMeasuresCam.comment=Compases visibles en la cámara.
config.nColsQuarter.comment=Resolución rítmica: columnas por negra. Valores comunes: 12, 24.
config.nColsScore.comment=Anchura total de la partitura en columnas (capacidad máxima).
config.autoCorrect.comment=Autocorrección al arrastrar: impide notas solapadas (true/false).
config.isMetallophone.comment=Modo metalófono (true) o registro MIDI personalizado (false).
config.midiRange.comment=Registro MIDI (solo si isMetallophone=false): nota más baja y más alta.

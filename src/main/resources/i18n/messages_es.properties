MyController.btn.help.title=Ayuda
MyController.help.text=Para introducir una nota, haz clic y arrastra en la cuadrícula.\nUsa Ctrl-Z para deshacer y Mayús-Ctrl-Z para rehacer.\nCtrl-I: inserta una columna (haz clic en la columna de destino). Ctrl-D: borra una columna (haz clic en la columna).\nPara seleccionar una nota individual, haz clic en el área gris que hay al lado de la tecla correspondiente del teclado.\nPara seleccionar un patrón, usa el botón Patrón y después haz clic en la tecla raíz del patrón.\nHaz clic en el botón de selección para desactivarla.\nUsa el botón Penta para mostrar las franjas de las notas seleccionadas.

help.dialog.title=Ayuda
help.dialog.welcome=Bienvenido/a a {0}. Por favor, informa de cualquier error a doderebuapp@dodecaphenia.org

help.section.grid.title=Introducir y editar notas
help.grid.intro=Edita la cuadrícula de notas con el ratón. Haz clic para añadir notas, arrastra para alargarlas y usa deshacer/rehacer para revertir los cambios.
help.grid.enter.key=Clic + arrastrar
help.grid.enter.desc=Introduce una nota (arrastra para alargarla)
help.grid.delete.key=Mayús + arrastrar
help.grid.delete.desc=Borra notas
help.grid.split.key=Doble clic
help.grid.split.desc=Divide una nota en dos
help.grid.move.key=Ctrl + Mayús + arrastrar
help.grid.move.desc=Mueve una nota
help.grid.undo.key=Ctrl-Z
help.grid.undo.desc=Deshacer la última acción
help.grid.redo.key=Ctrl-Mayús-Z
help.grid.redo.desc=Rehacer la última acción deshecha
help.grid.doublebar.key=Doble barra final
help.grid.doublebar.desc=La doble barra marca el final del compás que contiene la última nota. Se recalcula solo al reproducir y al guardar: mientras editas no se muestra, para no interferir con la navegación ni ir saltando a cada nota.

help.section.selection.title=Selección y portapapeles
help.selection.intro=Selecciona un bloque de notas manteniendo Ctrl pulsado y arrastrando. Una vez seleccionado, puedes copiar, cortar, pegar o replicar el bloque.
help.selection.select.key=Ctrl + arrastrar
help.selection.select.desc=Selecciona una región rectangular de notas
help.selection.copy.key=Ctrl-C
help.selection.copy.desc=Copia la selección
help.selection.cut.key=Ctrl-X
help.selection.cut.desc=Corta la selección
help.selection.paste.key=Ctrl-V
help.selection.paste.desc=Pega (después haz clic para colocar)
help.selection.replicate.key=Ctrl-R
help.selection.replicate.desc=Replica la selección un paso hacia delante
help.selection.replicateEnd.key=Ctrl-Mayús-R
help.selection.replicateEnd.desc=Replica la selección hasta el final de la partitura

help.section.columns.title=Operaciones de columnas
help.columns.intro=Inserta o elimina columnas de tiempo en la posición del playbar para ajustar el ritmo de la partitura.
help.columns.insert.key=Ctrl-I
help.columns.insert.desc=Inserta una o más columnas (después haz clic para colocar)
help.columns.delete.key=Ctrl-D
help.columns.delete.desc=Borra una o más columnas (después haz clic para seleccionar)

help.section.pattern.title=Patrón / Plantilla
help.pattern.intro=Los patrones generan un conjunto de notas activas en el teclado, para facilitar la composición dentro de una escala, un acorde o un intervalo concretos.
help.pattern.activate.key=Botón Patrón
help.pattern.activate.desc=Pulsa el botón Patrón y después haz clic en una tecla del teclado para definir la nota raíz
help.pattern.types.key=Escala / Acorde / Intervalo / Lista
help.pattern.types.desc=Elige el tipo de patrón en el diálogo que aparece
help.pattern.extend.key=Una octava / Todo el teclado
help.pattern.extend.desc=Elige si el patrón cubre una octava o se extiende a todo el registro del teclado
help.pattern.tonality.key=Ajustar a la tonalidad
help.pattern.tonality.desc=Aplica la escala mayor o menor de la tonalidad actual, centrada alrededor del do central
help.pattern.manual.key=Teclas deslizantes del teclado
help.pattern.manual.desc=Haz clic en las teclas deslizantes para añadir o quitar notas individuales del patrón

help.section.playback.title=Reproducción y navegación
help.playback.intro=Controles para reproducir la partitura, navegar por páginas y ajustar el tempo y el volumen de reproducción en vivo.
help.playback.first.key=Botón ||&lt;
help.playback.first.desc=Salta al principio de la partitura
help.playback.prevnextpage.key=Botones &lt;&lt; / >>
help.playback.prevnextpage.desc=Salta a la página anterior o siguiente
help.playback.prevnextcol.key=Botones &lt; / >
help.playback.prevnextcol.desc=Mueve el playbar una columna atrás o adelante
help.playback.pagenum.key=Botón número de página
help.playback.pagenum.desc=Haz clic para saltar a un número de compás concreto
help.playback.play.key=Botón Play / Pausa
help.playback.play.desc=Inicia o pausa la reproducción
help.playback.tempo.key=Botón Tempo
help.playback.tempo.desc=Haz clic para introducir un nuevo tempo en BPM
help.playback.volume.key=Vol+ / Vol-
help.playback.volume.desc=Modifica la marca de volumen vigente de la pista actual. El valor queda guardado en la partitura y el botón muestra siempre el de la marca.
help.playback.speed.key=Vel+ / Vel-
help.playback.speed.desc=Modifica la marca de tempo vigente. El valor queda guardado en la partitura y el botón muestra siempre el de la marca.
help.playback.transpose.key=Trp+ / Trp-
help.playback.transpose.desc=Transporta toda la partitura un semitono arriba o abajo (manteniendo el botón pulsado, se repite)
help.playback.tremolo.key=Botón Tremolo
help.playback.tremolo.desc=Activa o desactiva el efecto tremolo en la nota actual

help.section.mixer.title=Mezclador
help.mixer.intro=Gestiona las pistas de audio: cambia instrumentos, silencia u oculta pistas individuales y ajusta los volúmenes.
help.mixer.open.key=Botón Mixer
help.mixer.open.desc=Abre o cierra el panel del mezclador
help.mixer.track.key=Mute / Hide
help.mixer.track.desc=Mute silencia una pista durante la reproducción; Hide la oculta de la vista de la cuadrícula
help.mixer.instr.key=Botón Instr
help.mixer.instr.desc=Cambia el instrumento MIDI de la pista actual
help.mixer.drums.key=Botón Batería
help.mixer.drums.desc=Alterna entre modo melódico y modo percusión (canal 10)

help.section.chordslyrics.title=Acordes y letra
help.chordslyrics.intro=Añade acordes en la franja superior y letra en la franja inferior. Los acordes se muestran como símbolos en la franja superior y se puede cambiar su formato.
help.chords.add.key=Doble clic en la franja de acordes
help.chords.add.desc=Añade o edita un símbolo de acorde en la posición donde has hecho clic
help.chords.format.key=Botón Formato (franja de acordes)
help.chords.format.desc=Cambia el formato de los símbolos de acorde (Dodeca, Símbolo, Anglo, Solfeo...)
help.lyrics.edit.key=Doble clic en la franja de letra
help.lyrics.edit.desc=Abre el modo de edición de letra en la nota donde has hecho clic
help.lyrics.type.key=Escribe la sílaba
help.lyrics.type.desc=Escribe una sílaba o palabra; se asigna a la nota actual
help.lyrics.advance.key=Espacio / –
help.lyrics.advance.desc=Pasa a la nota siguiente (espacio para separar palabras; – para separar sílabas con guion). Si la nota siguiente queda fuera de la página, salta de página automáticamente.
help.lyrics.back.key=Mayús + Espacio
help.lyrics.back.desc=Vuelve a la nota anterior y carga su texto para editarlo. Si queda fuera de la página, salta de página automáticamente.
help.lyrics.exit.key=Escape
help.lyrics.exit.desc=Sale del modo de edición de letra

help.section.markers.title=Marcas de cambio
help.markers.intro=Las marcas se añaden haciendo clic en el botón correspondiente, introduciendo el valor en el diálogo y haciendo clic en la cuadrícula para colocarlas. Se visualizan en la franja de acordes como cajas de colores: azul (tempo), granate (tonalidad), verde (volumen) y amarillo (transposición). Al pasar el ratón por encima, el tip muestra su valor. Si el valor que introduces es el mismo que ya había, no se coloca ninguna marca (y si había una igual, se borra).
help.markers.timesig.key=Botón Compás
help.markers.timesig.desc=Añade una marca de cambio de compás en la posición elegida
help.markers.key.key=Botón Tonalidad
help.markers.key.desc=Añade una marca de cambio de tonalidad en la posición elegida
help.markers.tempo.key=Botón Tempo
help.markers.tempo.desc=Añade una marca de cambio de tempo (en BPM) en la posición elegida
help.markers.volume.key=Botón Volumen
help.markers.volume.desc=Añade una marca de cambio de volumen (0–127) para la pista actual en la posición elegida
help.markers.transpose.key=Marca de transposición (amarilla)
help.markers.transpose.desc=Muestra la transposición de la pista actual en semitonos. No se añade a mano: viene del instrumento de la pista, y por eso no se puede editar ni borrar. Al cambiar de pista cambia sola.
help.markers.place.key=Colocar la marca
help.markers.place.desc=Después de abrir el diálogo, haz clic en la columna de destino para colocar la marca. Enter (o el botón «Al inicio») la coloca al principio de la PARTITURA sin mover la vista; Ctrl+Enter, en el playbar. El botón Cancelar descarta el cambio.
help.markers.select.key=Clic / Doble clic / Supr
help.markers.select.desc=Un clic sobre una marca la selecciona (queda resaltada en amarillo), un doble clic la edita y Supr la borra. Las marcas del principio de la partitura se pueden editar pero no borrar: son la base de la partitura.

help.section.xylokeyboard.title=Teclado / Xilófono
help.xylokeyboard.intro=El teclado visual permite tocar notas en directo y seleccionarlas desplazándolas a la derecha, o devolverlas a su sitio desplazándolas a la izquierda.
help.xylokeyboard.play.key=Clic en una tecla
help.xylokeyboard.play.desc=Suena la nota correspondiente
help.xylokeyboard.slide.key=Haz clic en la zona gris
help.xylokeyboard.slide.desc=Hace deslizar la tecla
help.xylokeyboard.insert.key=Teclado derecho (activado)
help.xylokeyboard.insert.desc=Las notas tocadas se insertan en la partitura en la posición del playbar

help.section.score.title=Propiedades de la partitura
help.score.intro=Metadatos de la partitura: título, autor/a y descripción. Se incluyen al guardar y se recuperan al cargar.
help.score.title.key=Botón Título
help.score.title.desc=Define o edita el título de la partitura
help.score.author.key=Botón Autor/a
help.score.author.desc=Define o edita el autor/a de la partitura
help.score.description.key=Botón Descripción
help.score.description.desc=Define o edita la descripción / las notas de la partitura

help.section.key.title=Tonalidad
help.key.intro=Navega por las tonalidades en el círculo de quintas o selecciónalas directamente. Puedes transportar toda la partitura al cambiar de tono.
help.key.nextprev.key=Ton >> / Ton &lt;&lt;
help.key.nextprev.desc=Avanza o retrocede a la tonalidad siguiente o anterior (en el círculo de quintas)
help.key.reset.key=Botón Tono (central)
help.key.reset.desc=Abre el selector de tonalidad para saltar directamente a cualquier tono. Después pregunta si quieres transportar la partitura: arriba, abajo o no transportar. Arriba y abajo llevan a la misma tonalidad y se diferencian solo en el registro (una octava).

help.section.view.title=Vista
help.view.intro=Opciones de visualización de la cuadrícula, el teclado y la interfaz en general.
help.view.penta.key=Botón Penta / Plant
help.view.penta.desc=Alterna entre la vista Pentagrama (las filas grises señalan las notas del pentagrama, la fila roja señala el do central) y la vista Plantilla (ilumina únicamente las filas de la plantilla actual)
help.view.keyboard.key=Botón Izq / Der
help.view.keyboard.desc=Cambia la posición del teclado en pantalla entre el lado izquierdo y el lado derecho
help.view.names.key=Botón Nombres / Interv / Grado / Anglo / Oculta
help.view.names.desc=Botón circular: a cada clic avanza a la siguiente manera de rotular las notas en la cuadrícula: nombre (do móvil o absoluto, según el botón Absoluto/Móvil), intervalo en semitonos (0..11) relativo a la tonalidad, grado diatónico (1..7, con alteración si hace falta) relativo a la tonalidad, nombre anglosajón absoluto (p.ej. Eb), u oculto
help.view.mobiledo.key=Botón Absoluto / Móvil
help.view.mobiledo.desc=Alterna entre nombres de nota absolutos y do móvil (a la tónica siempre la llamamos do)
help.view.tips.key=Botón Tips On / Tips Off
help.view.tips.desc=Muestra u oculta los tips en la barra de estado
help.view.anacrusis.key=Botón Encajar
help.view.anacrusis.desc=Estrecha las columnas para encajar el primer compás en anacrusa con el resto de compases de la primera página. La anacrusa se produce cuando la pieza empieza antes del primer compás.

help.section.exercises.title=Ejercicios
help.exercises.intro=Navega por los ejercicios de entrenamiento auditivo del paquete activo y reinícialos cuando haga falta.
help.exercises.nextprev.key=Botones Ex>> / Ex&lt;&lt;
help.exercises.nextprev.desc=Salta al ejercicio siguiente o anterior del paquete actual
help.exercises.restart.key=Botón Reiniciar
help.exercises.restart.desc=Reinicia el ejercicio actual desde el principio

help.section.export.title=Archivos y exportación
help.export.intro=Abre, guarda y exporta la partitura. El formato nativo es .ddcgr.mid (compatible con MIDI); también puedes exportar como SVG o PDF. Al abrir un MIDI de otro programa, se toman de él el compás y la tonalidad. Al abrir nuestros MIDI con un editor de partituras como MuseScore, una figura corta seguida de silencio (por ejemplo corchea + silencio de corchea) puede aparecer como una figura larga con staccato: suena igual, y es una simplificación que hace su importador. Se puede desactivar en las opciones de importación de MIDI.
help.export.new.key=Botón Nueva
help.export.new.desc=Crea una partitura nueva vacía (pregunta si quieres guardar si hay cambios sin guardar)
help.export.load.key=Botón Abrir
help.export.load.desc=Abre un archivo de partitura (.ddcgr.mid)
help.export.svg.key=Botón SVG
help.export.svg.desc=Exporta la vista actual de la pantalla como archivo SVG
help.export.pdf.key=Botón PDF
help.export.pdf.desc=Imprime la partitura completa en un archivo PDF
help.export.midi.key=Botón Guardar
help.export.midi.desc=Guarda la partitura como archivo MIDI (.ddcgr.mid o .mid). El nombre que propone es el título seguido de la tonalidad (por ejemplo Titulo_Do o Titulo_la).


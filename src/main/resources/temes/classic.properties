# DoDeRe-Bú - tema gràfic «clàssic» / "classic" graphic theme
#
# L'aspecte de sempre de l'aplicació. També fa de reserva: qualsevol valor que
# falti en un altre tema, o que hi estigui mal escrit, es pren d'aquí.
# The application's original look. It is also the fallback for any value that
# is missing or malformed in another theme.
#
# Colors: r,g,b o r,g,b,a (0-255), o «colorsets» si el color l'ha de decidir
# ColorSets (els colors de les dotze notes i les seves gammes).
# Colours: r,g,b or r,g,b,a, or "colorsets" to let ColorSets decide.
# Gruixos en píxels, amb punt decimal. Guions: llarg,buit. Estils: normal o
# negreta. Interruptors: si o no. / Widths in pixels; dashes: on,off;
# styles: normal or negreta (bold); switches: si (yes) or no.
#
# Per fer un tema propi: copia aquest fitxer amb un altre nom a la mateixa
# carpeta, canvia els valors i posa «tema=<nom>» al config.properties.
# To make your own theme: copy this file under another name, edit it and set
# "tema=<name>" in config.properties. Restart the application to apply it.

nom = Clàssic

# ── General / General ────────────────────────────────────────────────────────
# Fons dels buffers i de les franges / Background of buffers and strips
fons = 255,255,255
# Tinta per defecte: línies, vores, rètols / Default ink: lines, borders, labels
tinta = 0,0,0
# Suavitzar el text (antialiàsing) / Smooth text (antialiasing)
text.suavitzat = no

# ── Graella / Grid ───────────────────────────────────────────────────────────
graella.separador.color = 128,128,128
graella.separador.gruix = 0.2
# Vista de pentagrama: espais, línies i do central / Staff view rows
pauta.espai = colorsets
pauta.linia = colorsets
pauta.doCentral = colorsets
# Vista de plantilla: notes del patró i la resta / Template view rows
patro.triat = colorsets
patro.fora = colorsets
# Text damunt de les notes i de les tecles / Text on notes and keys
nota.text = colorsets
# Color de la nota MI (cel·les i tecla); «colorsets» = el de sempre / Colour of note E
nota.mi = colorsets
# Carril de marques (tempo, tonalitat, volum) a dalt de la franja d'acords: fons
# («colorsets» = cap) i color de la fletxeta i les comes / Marks lane background and arrow colour
marques.fons = colorsets
marques.fletxa = 0,0,0
# Totes les notes de la partitura d'un sol color (p. ex. 128,128,128); «colorsets» = cada nota el seu
# All score notes in a single colour; "colorsets" = each note its own
nota.gris = colorsets
# Text de les notes de la graella quan van d'un sol color / Grid note text when single-coloured
nota.gris.text = colorsets
# Una nota que sona a la graella agafa el seu color? «no» = es posa del color de fons
# A sounding grid note takes its own colour? "no" = background colour
nota.sona.color = no
# Gama de colors de les notes: «config» (la de sempre) o «moni» (les làmines del xilòfon)
# Note colour range: "config" (as ever) or "moni" (the xylophone bars)
gama = config
# Vora esquerra d'una nota: «text» vol dir del mateix color que el text
# Note left edge: "text" means the same colour as the note text
nota.vora.color = text
nota.vora.gruix = 2
nota.vora.desplacament = 1
notaPuntejada.fons = 0,0,0
notaPuntejada.text = 255,255,255
seleccio.farciment = 0,100,255
seleccio.farciment.alfa = 0.3
seleccio.vora = 0,50,200
seleccio.vora.alfa = 0.8

# ── Línies / Lines ───────────────────────────────────────────────────────────
compas.gruix = 1.5
# La barra de compàs que es redibuixa damunt de la pantalla
# The measure line redrawn on screen
compas.pantalla.gruix = 2
temps.gruix = 1
temps.guions = 15,3
dobleBarra.gruixuda = 3
dobleBarra.prima = 2
dobleBarra.separacio = 4
reproduccio.gruix = 3

# ── Acords i marques / Chords and marks ──────────────────────────────────────
font.acords = SansSerif
font.acords.estil = negreta
trianglet.mitjaAmplada = 4
trianglet.alcada = 6
marca.tempo = 0,90,190
marca.tonalitat = 140,0,30
marca.volum = 0,130,55
marca.transposicio = 235,200,0
marcaSeleccionada.filet = 0,0,0
marcaSeleccionada.filet.gruix = 1
marcaSeleccionada.marc = 255,255,0
marcaSeleccionada.marc.gruix = 3

# ── Lletra / Lyrics ──────────────────────────────────────────────────────────
font.lletra = SansSerif
font.lletra.estil = normal
lletra.text = 0,0,0
lletra.edicio = 64,64,64
lletra.cursor = 0,0,255
lletra.cursor.gruix = 2
seleccioLletra.farciment = 0,90,190,60
seleccioLletra.vora = 0,90,190,160

# ── Interfície / Interface ───────────────────────────────────────────────────
font.interficie = Dialog
font.interficie.estil = negreta
panellBotons.fons = colorsets
boto.normal = colorsets
boto.premut = colorsets
boto.text = 255,255,255
boto.textPremut = 255,255,255
# 0 = rectangle; més de 0 = cantonades arrodonides / 0 = square corners
boto.arrodoniment = 0
# Espai entre el botó i la seva caixa / Gap between button and its box
boto.marge = 0
botoFormat.fons = 220,230,255
botoFormat.arrodoniment = 4
liniaEstat.fons = 128,128,128
liniaEstat.text = 255,255,255
slide = colorsets
# Una tecla que sona es ressalta (fons blanc, text negre)? Amb «no» no canvia d'aspecte.
tecla.ressalta = no
tecla.textQueSona = 0,0,0
tecla.senseColor = 192,192,192
# Tecles NO seleccionades del teclat (fora de la plantilla): 0 = color ple, 1 = blanc
# Keys outside the chosen template: 0 = full colour, 1 = white
tecla.apaga = 0.0
# Text de les tecles no seleccionades: «colorsets» = el de les notes / Unselected-key text
tecla.text = colorsets
tecla.font.proporcio = 0.65
tecla.font.minima = 8

# ── Caixes del costat del teclat / Boxes beside the keyboard ─────────────────
# Les dues caixes d'Acords (a dalt) i de Lletra (a baix), a l'esquerra: cadascuna
# té el seu fons i tenen un marc. Gruix 0 = sense marc.
# The Chords box (top) and the Lyrics box (bottom) beside the keyboard: each has
# its own background, and both have a frame. Width 0 = no frame.
caixaAcords.fons = 255,255,255
caixaLletra.fons = 255,255,255
caixa.vora.color = 0,0,0
caixa.vora.gruix = 1

# ── Tips (les finestretes que expliquen un botó) / Tips (button help popups) ──
# colorsets = el color que posi el sistema / the system's own colour
# tip.font.mida: 0 = la del sistema / 0 = the system's size
# tip.vora.gruix: 0 = el marc del sistema / 0 = the system's frame
tip.fons = colorsets
tip.text = colorsets
tip.vora.color = colorsets
tip.vora.gruix = 0
tip.marge = 0
tip.font.mida = 0

# ── Icones i fletxes dels botons / Button icons and arrows ───────────────────
# Mida de la icona (play, pausa, inici) respecte del botó, i de les fletxes de
# «Tò >>» respecte de les majúscules del rètol.
# Icon size relative to the button, and arrow size relative to the label capitals.
icona.proporcio = 0.42
fletxa.proporcio = 1.0

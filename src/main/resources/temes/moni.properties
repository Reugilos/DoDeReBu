# DoDeRe-Bú - tema gràfic «moni» / "moni" graphic theme
#
# L'estil del manual del DoDeRe-Bú (Guia_Mara, nov. 2026): fons blanc, línies
# del pentagrama en gris càlid, el do central en rosa, la plantilla en groc
# pàl·lid, separadors gris clar, text blanc sobre les notes, plafons en blau
# clar i lletra geomètrica. Colors mesurats sobre el PDF del manual.
# The look of the DoDeRe-Bú booklet (Nov. 2026), colours measured on its PDF.
#
# Mateix format que classic.properties; el que falti aquí es pren d'allà.
# Same format as classic.properties; anything missing is taken from it.

nom = Moni (notes de la graella de colors)

# ── General / General ────────────────────────────────────────────────────────
fons = 255,255,255
tinta = 0,0,0
text.suavitzat = si

# ── Graella / Grid ───────────────────────────────────────────────────────────
graella.separador.color = 217,217,217
graella.separador.gruix = 1
pauta.espai = 255,255,255
pauta.linia = 238,236,236
pauta.doCentral = 255,214,214
# Només al PDF (la pantalla no es toca) / PDF only (screen untouched).
# Separadors de fila de la graella: color i gruix en punts PDF (0 = com a la pantalla).
pdf.graella.separador.color = 110,110,110
pdf.graella.separador.gruix = 0.25
# Franges del pentagrama al PDF, més fosques perquè es vegin en imprimir (colorsets = com a la pantalla)
pdf.pauta.espai = 255,255,255
pdf.pauta.linia = 205,202,202
pdf.pauta.doCentral = 255,210,210
# Per revertir / To revert: 250,255,205 (anterior), 245,255,171 (original)
patro.triat = 242,255,218
patro.fora = 255,255,255
# El manual escriu en blanc fins i tot sobre el groc del mi.
# The booklet writes white even on the yellow of mi.
nota.text = 255,255,255
# El mi, un pèl més ataronjat que el groc de sempre / Note E, slightly more orange
nota.mi = colorsets
# Totes les notes de la partitura en gris / All score notes grey
# Abans 219,231,249 (el blau del fons del panell de botons); ara una mica més fosc
# moni: les notes de la graella surten de COLORS (cadascuna el color de la seva nota, de la gamma
# colors_manual) i amb el text blanc. La resta és idèntica a moni2.
nota.gris = colorsets
nota.gris.text = colorsets
# Les notes que sonen a la graella agafen el seu color / Sounding grid notes take their own colour
nota.sona.color = si
# Carril de marques: fons blau molt clar
marques.fons = 238,244,252
# Dues notes seguides se separen amb un filet blanc / White gap between notes
nota.vora.color = 255,255,255
nota.vora.gruix = 1
nota.vora.desplacament = 0
notaPuntejada.fons = 0,0,0
notaPuntejada.text = 255,255,255
seleccio.farciment = 0,100,255
seleccio.farciment.alfa = 0.3
seleccio.vora = 0,50,200
seleccio.vora.alfa = 0.8

# ── Línies / Lines ───────────────────────────────────────────────────────────
compas.gruix = 1.5
compas.pantalla.gruix = 2
temps.gruix = 1
# Guions curts, com al dodecagrama del manual / Short dashes
temps.guions = 5,4
dobleBarra.gruixuda = 3
dobleBarra.prima = 2
dobleBarra.separacio = 4
reproduccio.gruix = 3

# ── Acords i marques / Chords and marks ──────────────────────────────────────
font.acords = Century Gothic
font.acords.estil = negreta
trianglet.mitjaAmplada = 4
trianglet.alcada = 6
# El blau del «60» i el morat del «Do» del manual
marca.tempo = 32,89,164
marca.tonalitat = 85,84,160
marca.volum = 22,132,96
marca.transposicio = 240,205,0
marcaSeleccionada.filet = 0,0,0
marcaSeleccionada.filet.gruix = 1
marcaSeleccionada.marc = 255,255,0
marcaSeleccionada.marc.gruix = 3

# ── Lletra / Lyrics ──────────────────────────────────────────────────────────
font.lletra = Century Gothic
font.lletra.estil = normal
lletra.text = 0,0,0
lletra.edicio = 64,64,64
lletra.cursor = 0,0,255
lletra.cursor.gruix = 2
seleccioLletra.farciment = 0,90,190,60
seleccioLletra.vora = 0,90,190,160

# ── Interfície / Interface ───────────────────────────────────────────────────
font.interficie = Century Gothic
font.interficie.estil = negreta
# Blau clar dels plafons del manual / Light blue of the booklet panels
panellBotons.fons = 219,231,249
# Botons blancs i arrodonits, com les bafarades del manual; premuts, blaus
boto.normal = 255,255,255
boto.premut = 32,89,164
boto.text = 35,35,45
boto.textPremut = 255,255,255
boto.arrodoniment = 12
boto.marge = 2
botoFormat.fons = 219,231,249
botoFormat.arrodoniment = 4
# El gris de la capçalera del manual / The booklet's header grey
liniaEstat.fons = 242,242,242
liniaEstat.text = 35,35,45
# Al manual, la columna dels slides és blanca / White slide column
slide = 255,255,255
# Una tecla que sona es ressalta (fons blanc, text negre)? Amb «no» no canvia d'aspecte.
# Amb «no», la tecla que sona s'il·lumina INVERTINT el seu estat: una no seleccionada agafa
# el color ple i una seleccionada l'apagat. Amb «si», es posa blanca amb el nom en negre.
# With "no", a sounding key inverts its state (unselected -> full colour, selected -> dimmed).
tecla.ressalta = no
tecla.textQueSona = 0,0,0
tecla.senseColor = 192,192,192
# Tecles seleccionades (de la plantilla): color ple i nom en blanc. No seleccionades:
# apagades (75% cap al blanc, tons pàl·lids) amb el nom en blanc (es veu poc); si no n'hi ha cap de seleccionada, totes enceses. Quan sonen: blanques amb el nom en negre.
# Selected keys: full colour, white name. Others: dimmed (towards white), black name.
# Sounding: white with black name.
tecla.apaga = 0.75
# Apagades cap al blanc (tons pàl·lids)
tecla.apaga.cap = 255,255,255
tecla.text = colorsets
tecla.font.proporcio = 0.65
tecla.font.minima = 8
# Proporcio de la lletra respecte a l alcada d una fila (prova 21-11-26; abans 0,85).
# Interficie: botons, linia d estat i titols de les caixes. Acords: acords i marques (to, tempo, volum).
# Font size relative to row height: interface (buttons, status line, box titles); chords and marks.
font.interficie.proporcio = 1.0
font.acords.proporcio = 0.95
# Marques de la franja superior (to, tempo, volum, instrument); limitada per l alcada del carril.
font.marques.proporcio = 1.15
# Escala de la lletra dels menus i dialegs de Swing (finestres que s obren, selector de fitxers...); 1 = la del sistema.
font.menus.escala = 1.25
# Mida minima (punts) de la lletra dels menus i dialegs: el sistema en dona de molt petites (7); 0 = sense minim.
font.menus.minima = 12

# ── Caixes del costat del teclat / Boxes beside the keyboard ─────────────────
caixaAcords.fons = 255,255,255
caixaLletra.fons = 255,255,255
caixa.vora.color = 0,0,0
caixa.vora.gruix = 1

# ── Tips: els de sempre (groc del sistema, doble marc) / Tips: the system's own ─
tip.fons = colorsets
tip.text = colorsets
tip.vora.color = colorsets
tip.vora.gruix = 0
tip.marge = 0
tip.font.mida = 0

# ── Icones i fletxes dels botons / Button icons and arrows ───────────────────
icona.proporcio = 0.42
fletxa.proporcio = 1.0

# ── Gama de colors / Note colours ────────────────────────────────────────────
# Els colors de les làmines del xilòfon físic (veure ColorSets.setGamaColorsManual).
# The physical xylophone bar colours.
gama = colors_manual
